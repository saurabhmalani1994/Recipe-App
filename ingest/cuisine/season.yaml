# Seasonality of fresh produce, `ingest` owns this file (brief S5b #4). Peak months for a
# temperate northern-hemisphere growing season, since the owner's own location is not yet
# known (D14 general note; no ruling pins a location, so this is the default until one does).
# Months are 1=January .. 12=December, and mean "in peak season fresh", not "available" (most
# of this produce is sold year-round via storage/import; peak is when it is cheapest and best).
#
# Only produce (fruit/vegetable) slugs from ingest/taxonomy/ingredients.yaml are listed here;
# a slug this file doesn't mention (a pantry staple, a spice, a protein, an out-of-season
# import with no real peak) is simply never "in season" by season.py, not an error.

