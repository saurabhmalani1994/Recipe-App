    Italian: italian
    French: french
    Spanish: spanish
    German: german_central_eu
    Polish: german_central_eu
    Danish: german_central_eu
    Lithuanian: german_central_eu
    "Eastern European": german_central_eu
    Scandinavian: german_central_eu
    Finland: german_central_eu
    American: american
    Mexican: mexican
    Brazilian: latin_american
    Jamaican: caribbean
    Turkish: turkish
    Persian: persian
    "Middle Eastern": middle_eastern
