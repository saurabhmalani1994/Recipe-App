# Substitutions table v1.
#
# Each entry swaps one target ingredient for a substitute made of one or more components.
# amount is per 1 unit of the target:
#   - no `per` field: every component unit is `x`, a multiple of the target quantity in the
#     same unit (1 tbsp target -> amount x 1 tbsp of the component).
#   - `per: <unit>`: amounts are absolute for one <unit> of the target
#     (per: cup, milk 15 tbsp + lemon_juice 1 tbsp = 1 cup buttermilk).
# quality: 3 = hard to tell apart, 2 = good swap with a noticeable difference, 1 = works in a pinch
#   or the ratio is uncertain (the note says which).
# Diet flags are NOT stored here. validate.py computes them from the components.
version: 1
entries:
