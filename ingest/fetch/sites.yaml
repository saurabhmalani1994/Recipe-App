# Cuisine-specialist site registry (slice S17). Read by fetch_sites.py.
#
# Each entry:
#   id             stable source id; raw_recipe.id is "<id>:<slug>", raw_recipe.source is <id>
#   cuisine_label  the source's own regional identity, written straight into raw_recipe's
#                  cuisine_label field (not yet mapped to the canonical list in
#                  ingest/cuisine/cuisines.yaml -- that mapping is a later slice's job)
#   base_url       site root, used for robots.txt and as a fallback crawl start
#   sitemap_urls   sitemap(s) to read page URLs from, tried in order; a plain <urlset> or a
#                  <sitemapindex> both work (fetch_sites.py expands an index one level)
#   url_filter     a regex a discovered page URL must match to be crawled (keeps hub/tag/
#                  category/search pages out of the crawl without a wasted fetch)
#   israeli_check  true if this cuisine bucket needs the per-record R16 title/tag check
#                  (every "mediterranean" entry does; the others are cuisine-exclusive sites
#                  so the check is a no-op safety net there too, cheap to always run)
#
# See ingest/sources_cuisine.md for how each site was checked and why the others were dropped.

sites:
  # -- Indian --------------------------------------------------------------
  - id: indianhealthyrecipes
    cuisine_label: indian
    base_url: https://www.indianhealthyrecipes.com
    sitemap_urls:
      - https://www.indianhealthyrecipes.com/sitemap.xml
    url_filter: '^https://www\.indianhealthyrecipes\.com/[a-z0-9-]+/$'
    israeli_check: false

  - id: hebbarskitchen
    cuisine_label: indian
    base_url: https://hebbarskitchen.com
    sitemap_urls:
