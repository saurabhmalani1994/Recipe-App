# Canonical ingredient taxonomy. Owned by `ingest` (ingest/taxonomy/taxonomy.py loads,
# validates and indexes it). The substitutions table (ingest/subs) and the ingredient-line parser
# (ingest/parse) both read this file; nothing else keeps a copy.
#
# Keys are slugs (lowercase snake_case). Each entry has:
#   name        display name; also matched by the parser
#   synonyms    other names: US/UK/Indian/other spellings and common brand-generic names.
#               Matching normalizes case, accents, punctuation and plurals, so "Tomatoes" and
#               "tomato" need not both be listed. A normalized name may name only one slug.
#   category    flavour/role group (see CATEGORIES in taxonomy.py)
#   aisle       produce, dairy, meat, seafood, bakery, pantry, spices, international, frozen,
#               beverages, other
#   flags       diet flags that are true (below)
#   is_staple   assumed on hand (water, salt, black pepper, neutral oil...)
#   parent      optional: the broader slug a variety falls back to (roma_tomato -> tomatoes)
#   density_g_per_ml, each_g, usda_hint   optional: unit conversion and the later USDA match
#   hidden_animal, note   optional free text
#   shop_unit, yield, buy_as   optional purchase fields for the grocery list (S7c; set on the ~300
#               most-used slugs). shop_unit is what the shopper sees: piece, bunch, head, g, ml,
#               can, bottle, jar, pack. yield {qty, unit} is how much of THIS slug one shop_unit
#               gives (garlic: a head gives 10 clove; soy_sauce: a bottle gives 250 ml); required
#               for bunch/head/can/bottle/jar/pack, absent for g/ml, optional for piece (each_g is
#               used instead). buy_as is the slug actually bought (lemon_juice -> lemon, egg_yolk
#               -> egg); it needs a yield and the same shop_unit as its target.
#
# flags lists only the flags that are true. Meaning of each flag:
#   red_meat, poultry, fish, shellfish: the ingredient is, or is made from, that animal
#   animal_derived: contains slaughter-derived material that is easy to miss (gelatin, lard,
#     rennet, stocks, fish or shellfish in a sauce). Dairy, egg and honey are NOT animal_derived.
#   explicit_meat (D15/R7): the ingredient IS the protein source, or a stock/broth/bouillon/fat
#     named for one -- meat, poultry, fish or shellfish as a protein (fillets, mince, bacon,
#     anchovy fillets, canned tuna), or chicken/beef/turkey stock, dashi, lard, suet, schmaltz,
#     bacon fat, duck fat. It is NOT set on condiments and hidden-animal items even when they
#     carry red_meat/poultry/fish/shellfish: oyster sauce, fish sauce, Worcestershire, shrimp
#     paste, anchovy paste, XO sauce, gelatin, and rennet cheeses -- per the owner, vegetarian is
#     mostly about the protein source, not every trace of animal. An unnamed "stock", "broth" or
#     "gravy" is read as meat-based (explicit_meat), the conservative reading.
#   dairy, egg, gluten, nuts (tree nuts and peanuts), alcohol: contains it
# hidden_animal: what the non-obvious animal ingredient is.
# Flags are conservative: where brands differ and the common product contains it, it is flagged
# and the note says so.
