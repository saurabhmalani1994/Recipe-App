<html><head><script type="application/ld+json">{"@context":"https://schema.org","@id":"https://www.bbcgoodfood.com/recipes/panettone-2#Recipe","@type":"Recipe","description":"A fragrant, festive, and genuinely doable panettone at home","image":[{"@type":"ImageObject","url":"https://images.immediate.co.uk/production/volatile/sites/30/2026/05/Panettone-Lucy-Bridge-860377e.jpg?resize=768,768","width":768,"height":768},{"@type":"ImageObject","url":"https://images.immediate.co.uk/production/volatile/sites/30/2026/05/Panettone-Lucy-Bridge-860377e.jpg?resize=1366,1366","width":1366,"height":1366}],"mainEntityOfPage":{"@type":"WebPage","@id":"https://www.bbcgoodfood.com/recipes/panettone-2"},"name":"Panettone","url":"https://www.bbcgoodfood.com/recipes/panettone-2","author":[{"@type":"Person","name":"Lucy Bridge","url":"https://www.bbcgoodfood.com/author/lucy-bridge"}],"dateModified":"2026-09-02T11:03:47+01:00","datePublished":"2026-09-02T11:03:47+01:00","headline":"Panettone","keywords":"Panettone","publisher":{"@type":"Organization","name":"Good Food","url":"https://www.bbcgoodfood.com","logo":{"@type":"ImageObject","height":325,"url":"https://images.immediate.co.uk/production/volatile/sites/30/2026/02/goodfood.logo-f37096c.png?resize=1312,325","width":1312}},"isAccessibleForFree":"False","hasPart":{"@type":"WebPageElement","isAccessibleForFree":"False","cssSelector":".zephr-locked-content"},"cookTime":"PT50M","nutrition":{"@type":"NutritionInformation","calories":"681 calories","fatContent":"22 grams fat","saturatedFatContent":"11 grams saturated fat","carbohydrateContent":"98 grams carbohydrates","sugarContent":"37 grams sugar","fiberContent":"4 grams fiber","proteinContent":"16 grams protein","sodiumContent":"0.61 milligram of sodium"},"prepTime":"PT1H","recipeIngredient":["10g fast-action dried yeast","620g strong white bread flour plus extra for dusting","100g golden beetroot","3 tbsp warm milk","5 medium eggs beaten","150g butter softened, plus extra for proving and the tin","80g raisins","80g sultanas","3 tbsp dark rum","2 tsp vanilla extract or 1 tsp aroma panettone essential oil (don’t overdo this, it is strong)","1 lemon zested","1 orange zested","100g  good-quality candied orange and lemon peel (if you can find candied citron then sub in a little of that to add perfume)","30g whole blanched almonds roughly chopped or flaked almonds","1 tbsp golden caster sugar","1 tbsp egg white (easiest from a carton)","1 tbsp icing sugar"],"recipeInstructions":[{"@type":"HowToStep","text":"Mix 1 tbsp fast-action yeast with 100g of the flour, 1 tbsp of the caster sugar, the warm milk and 100ml warm water, then leave for 20-30 mins until doubled in size."},{"@type":"HowToStep","text":"Put the yeast and flour mixture in a stand mixer with a dough hook attachment, add the remaining flour to the bowl and start to mix on the lowest speed. Add the eggs slowly to make a dough, then beat in the butter bit by bit. Tip into a buttered bowl with plenty of room for the dough to expand and grow, cover and put in the fridge overnight."},{"@type":"HowToStep","text":"Put the raisins and sultanas in a small pan with the rum and cook over a low heat until the rum is absorbed, about 5 mins. Set aside to cool, then add the vanilla or aroma panettone, grated zest and candied fruit. Mix well."},{"@type":"HowToStep","text":"Butter and line a 20cm cake tin, or line with a panettone paper case. If you don’t have a deep tin, cut baking parchment to line the tin so it stands above the sides to a height of 20 cm."},{"@type":"HowToStep","text":"Turn the dough out onto a floured surface. Gently stretch into a rough rectangle, spread half of the fruit and zest mixture over the dough, folding each side on itself to incorporate the fruit, then repeat this process with the other half of the fruit."},{"@type":"HowToStep","text":"Shape the dough into a round using your palm to neatly tuck the dough in on itself. Place the dough into the lined cake tin and lightly cover to stop it drying out. Leave in a warm place for 3 hrs or until 1.5 times the size."},{"@type":"HowToStep","text":"Heat the oven to 180C/160C fan/gas 4, adjust the oven shelf to the lower third of the oven to give the dough space to grow. Mix the almonds, caster sugar and egg white for the topping, then brush this over the top of the panettone."},{"@type":"HowToStep","text":"Bake for 40-50 mins or until a skewer comes out clean. Either leave to cool in the tin for 10 mins before turning out onto a wire rack, or lift the panettone out of the tin and push a hanging skewer through the base, lay the ends of the skewer on two items of the same height (two piles of cookbooks, for example), and leave the panettone to cool upside down. Cool completely before dusting lightly with icing sugar. Cut into slices to serve."}],"recipeYield":"Serves 8","suitableForDiet":"https://schema.org/VegetarianDiet","totalTime":"PT1H50M"}</script><script type="application/ld+json">{"@context":"https://schema.org/","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.bbcgoodfood.com/"},{"@type":"ListItem","position":2,"name":"Recipes","item":"https://www.bbcgoodfood.com/recipes"},{"@type":"ListItem","position":3,"name":"Panettone"}]}</script></head><body></body></html>
