name: app

on:
  push:
    paths:
      - 'app/**'
      - 'corpus/**'
      - '.gitattributes'
      - '.github/workflows/app.yml'

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # corpus/corpus.db (the real library, S19) is in git LFS, cached by its oid so a run whose
      # corpus is unchanged takes it from the cache instead of spending LFS bandwidth: the checkout
      # skips LFS (lfs: true would download before the cache could be restored), the cache is
      # restored into .git/lfs, and `git lfs pull` downloads only what the cache lacked.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Corpus LFS oid
        id: lfs
        working-directory: .
        run: |
          oid="$(git lfs ls-files -l -I corpus/corpus.db | cut -d' ' -f1)"
          test -n "$oid" || { echo "corpus/corpus.db is not tracked by LFS"; exit 1; }
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-corpus-${{ steps.lfs.outputs.oid }}

      - name: Pull the corpus from LFS
        working-directory: .
        run: |
          git lfs pull --include corpus/corpus.db
          echo "${{ steps.lfs.outputs.oid }}  corpus/corpus.db" | sha256sum -c -

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run

      # The web build bundles the 300-recipe fixture (src/corpus/fixture.db).
      - name: Web build
        run: npm run build

      # The APK bundles the real library: rebuild the web assets with it before the sync.
      - name: Web build with the real corpus (for the APK)
        run: npm run build
        env:
          CORPUS_DB_FILE: corpus/corpus.db

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Check the APK assets hold the real corpus
        working-directory: .
        run: cmp corpus/corpus.db app/android/app/src/main/assets/public/assets/databases/corpus.db

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Device smoke gate (S21, ORCHESTRATION.md section 8: "the packaged build launches with its
  # assets"). Boots an API 34 x86_64 emulator, installs the debug APK built above (the real
  # library bundled), launches it and waits up to 10 minutes for `[corpus] ready <n> recipes` in
  # logcat; a `could not be opened` line, a crash or the timeout fails the build. This is where
  # the plugin's native read-only behaviour, which no web test can reach, runs for real.
  device-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      # Hardware acceleration for the x86_64 emulator on the hosted runner.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner executes each script line on its own, so the gate is one script call.
      - name: Launch the APK on an emulator and wait for the corpus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash app/scripts/device-smoke.sh apk/app-debug.apk 600
