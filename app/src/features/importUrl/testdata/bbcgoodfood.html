<html lang="en">
<head>
<meta charset="utf-8">
<title>Biscoff rocky road recipe | BBC Good Food</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Biscoff rocky road",
  "image": [
    "https://images.immediate.co.uk/production/volatile/sites/30/2026/06/Biscoff-Rocky-Road-6191772.jpg?resize=768,512"
  ],
  "author": { "@type": "Person", "name": "Good Food team" },
  "recipeYield": "Cuts into 16 squares",
  "prepTime": "PT15M",
  "cookTime": "PT5M",
  "totalTime": "PT20M",
  "recipeCategory": "Dessert",
  "recipeCuisine": "British",
  "recipeIngredient": [
    "175g Lotus Biscoff smooth spread",
    "150g salted butter cut into cubes",
    "250g white chocolate roughly chopped",
    "150g Lotus Biscoff biscuits",
    "60g mini marshmallows (vegetarian, if needed)",
    "80g pecans roughly chopped"
  ],
  "recipeInstructions": [
    {
      "@type": "HowToStep",
      "text": "Melt the Biscoff spread, salted butter and 200g of the white chocolate in a large heatproof bowl set over a pan of simmering water (making sure the water doesn’t touch the bowl), stirring until glossy and smooth. Remove from the heat and set aside to cool slightly. Meanwhile, lightly crush the Biscoff biscuits so you have pieces in a mixture of sizes."
    },
    {
      "@type": "HowToStep",
      "text": "Stir the crushed biscuits, mini marshmallows and pecans into the melted Biscoff mixture. Scrape into an 18cm square tin lined with baking parchment, level the surface and chill for at least 3 hrs, or until completely solid."
    },
    {
      "@type": "HowToStep",
      "text": "Meanwhile, melt the remaining 50g white chocolate in a heatproof bowl over a pan of simmering water as before or in short bursts in the microwave. Remove the rocky road from the tin and cut into 16 squares, then drizzle over the melted white chocolate. Leave to set slightly before serving."
    }
  ]
}
</script>
</head>
<body>
<article>
  <h1>Biscoff rocky road</h1>
  <p>A no-bake traybake with Biscoff spread, white chocolate and crunchy biscuits.</p>
</article>
</body>
